<script>
(function (root) {
  'use strict';
  const sports = ['Football', 'Cricket', 'Badminton'];
  const time = value => /^\d{2}:\d{2}$/.test(value) && Number(value.slice(0, 2)) < 24 && Number(value.slice(3)) < 60;
  const minutes = value => Number(value.slice(0, 2)) * 60 + Number(value.slice(3));
  const starts = item => new Date(item.date + 'T' + item.time + ':00+05:30').getTime();
  const deadline = item => starts(item) - 60 * 60 * 1000;
  const closed = item => ['cancelled', 'expired', 'completed'].includes(item.status);
  const key = value => String(value).trim().replace(/\s+/g, ' ').toLowerCase();
  function text(value, label, max) {
    const clean = String(value || '').trim().replace(/\s+/g, ' ');
    if (!clean || clean.length > max) throw new Error(label + ' must contain 1–' + max + ' characters.');
    return clean;
  }
  function validateSlot(input, state, now = Date.now()) {
    const venue = text(input.venue, 'Venue', 80);
    if (!sports.includes(input.sport)) throw new Error('Choose a supported sport.');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(input.date) || !time(input.time) || !Number.isFinite(starts(input))) throw new Error('Choose a valid date and time.');
    if (new Date(input.date + 'T12:00:00Z').toISOString().slice(0, 10) !== input.date) throw new Error('Choose a valid calendar date.');
    if (deadline(input) <= now) throw new Error('Choose a slot more than one hour in the future.');
    const price = Number(input.price);
    if (!Number.isInteger(price) || price < 100 || price > 50000) throw new Error('Enter a whole-rupee price between ₹100 and ₹50,000.');
    const end = starts(input) + 3600000;
    const overlap = other => key(other.venue) === key(venue) && starts(other) < end && starts(input) < starts(other) + 3600000;
    if (state.slots.some(overlap) || state.matches.some(m => !closed(m) && overlap(m))) throw new Error('This playing area already has an overlapping slot or match. Use a separate name for another court.');
    return { ...input, venue, price, blocked: false };
  }
  function available(slot, state, now = Date.now()) {
    return !slot.blocked && deadline(slot) > now && !state.matches.some(m => m.slot === slot.id && !closed(m));
  }
  function create(input, state, now = Date.now()) {
    const title = text(input.title, 'Match name', 70);
    const total = Number(input.total);
    if (!sports.includes(input.sport)) throw new Error('Choose a supported sport.');
    if (!Number.isInteger(total) || total < 2 || total > 30) throw new Error('Choose 2–30 whole player places.');
    if (['Football', 'Cricket'].includes(input.sport) && total % 2) throw new Error('Choose an even player count for two equal teams.');
    if (input.sport === 'Badminton' && ![2, 4].includes(total)) throw new Error('Badminton supports singles (2) or doubles (4).');
    const slot = state.slots.find(s => s.id === Number(input.slot));
    if (!slot || !available(slot, state, now)) throw new Error('This slot is unavailable or its joining deadline has passed.');
    if (slot.sport !== input.sport) throw new Error('Choose a slot for the selected sport.');
    if (Math.round(slot.price * 100) % total) throw new Error('The price must divide equally to the paise. Choose another player count.');
    return { id: input.id, title, sport: input.sport, venue: slot.venue, date: slot.date, time: slot.time, total, joined: 0, price: slot.price / total, mine: false, host: true, status: 'open', slot: slot.id };
  }
  function expire(state, now = Date.now()) {
    let count = 0;
    for (const match of state.matches) {
      if (closed(match)) continue;
      if (match.joined < match.total && deadline(match) <= now) {
        match.status = 'expired'; match.wasMine = match.wasMine || match.mine; match.mine = false; match.joined = 0;
        state.payments.filter(p => p.match === match.id && p.status === 'Paid').forEach(p => { p.status = 'Refunded'; p.reason = 'Joining deadline expired'; });
        count++;
      } else if (match.joined === match.total && starts(match) + 3600000 <= now) match.status = 'completed';
    }
    return count;
  }
  function join(state, id, now = Date.now()) {
    const match = state.matches.find(m => m.id === id);
    if (!match || closed(match) || deadline(match) <= now || match.mine || match.joined >= match.total) throw new Error('This place is no longer available. Refresh the match list.');
    if (state.matches.some(m => m.mine && !closed(m) && Math.abs(starts(m) - starts(match)) < 3600000)) throw new Error('You have already joined a match that overlaps this time.');
    match.mine = true; match.wasMine = true; match.joined++;
    return match;
  }
  function withdraw(state, id, now = Date.now()) {
    const match = state.matches.find(m => m.id === id);
    if (!match || !match.mine || closed(match) || starts(match) <= now) throw new Error('This match can no longer be withdrawn from.');
    match.mine = false; match.wasMine = true; match.joined--;
    state.payments.filter(p => p.match === id && p.status === 'Paid').forEach(p => { p.status = 'Refunded'; p.reason = 'Player withdrawal'; });
    expire(state, now);
  }
  function cancel(state, id) {
    const match = state.matches.find(m => m.id === id);
    if (!match || closed(match)) throw new Error('This match is already closed.');
    match.wasMine = match.wasMine || match.mine; match.mine = false; match.joined = 0; match.status = 'cancelled';
    state.payments.filter(p => p.match === id && p.status === 'Paid').forEach(p => { p.status = 'Refunded'; p.reason = 'Match cancelled'; });
  }
  function normalize(value) {
    if (!value || typeof value !== 'object' || !value.profile || !['matches','payments','slots','owners','activity'].every(k => Array.isArray(value[k]))) throw new Error('Saved demo data is incomplete.');
    text(value.profile.name, 'Name', 40); text(value.profile.area, 'Area', 60);
    if (!sports.includes(value.profile.sport)) throw new Error('Invalid saved sport.');
    for (const m of value.matches) {
      if (!Number.isFinite(m.id) || !sports.includes(m.sport) || !Number.isInteger(m.total) || m.total < 2 || !Number.isInteger(m.joined) || m.joined < 0 || m.joined > m.total || !Number.isFinite(m.price) || m.price <= 0 || !Number.isFinite(starts(m))) throw new Error('Saved match data is invalid.');
      text(m.title, 'Title', 70); text(m.venue, 'Venue', 80);
      m.wasMine = Boolean(m.wasMine || m.mine || value.payments.some(p => p.match === m.id));
      if (m.status === 'cancelled') { m.mine = false; m.joined = 0; }
    }
    for (const s of value.slots) {
      if (!Number.isFinite(s.id) || !Number.isFinite(s.price) || s.price <= 0 || !Number.isFinite(starts(s))) throw new Error('Saved slot data is invalid.');
      text(s.venue, 'Venue', 80);
      s.sport = s.sport || (s.venue.toLowerCase().includes('boundary') ? 'Cricket' : s.venue.toLowerCase().includes('court') ? 'Badminton' : 'Football');
    }
    for (const p of value.payments) if (!Number.isFinite(p.amount) || !['Paid','Refunded'].includes(p.status)) throw new Error('Saved payment data is invalid.');
    value.version = 2;
    return value;
  }
  const api = { sports, text, starts, deadline, closed, available, create, validateSlot, join, withdraw, cancel, expire, normalize, endTime: t => { const n = (minutes(t) + 60) % 1440; return String(Math.floor(n/60)).padStart(2,'0') + ':' + String(n%60).padStart(2,'0'); } };
  if (typeof module !== 'undefined') module.exports = api;
  else root.TrufDomain = api;
})(typeof window !== 'undefined' ? window : globalThis);

const D=TrufDomain;
function readRole(){try{return ['owner','admin','player'].includes(sessionStorage.getItem('truf-role'))?sessionStorage.getItem('truf-role'):'player'}catch{return 'player'}}
(function(root){
  const day=ms=>new Date(ms+19800000).toISOString().slice(0,10);
  const monday=date=>{const d=new Date(date+'T00:00:00Z');d.setUTCDate(d.getUTCDate()-((d.getUTCDay()+6)%7));return d.getTime()};
  function records(rows){return [...new Map((rows||[]).filter(r=>r&&typeof r.match==='number'&&/^\d{4}-\d{2}-\d{2}$/.test(r.date)&&['Football','Cricket','Badminton'].includes(r.sport)).map(r=>[r.match,r])).values()]}
  function progress(rows, sport='All sports', now=Date.now()){
    const today=day(now), current=monday(today), week=604800000;
    const played=records(rows).filter(r=>r.date<=today&&(sport==='All sports'||r.sport===sport));
    const weeks=[...new Set(played.map(r=>monday(r.date)))].sort((a,b)=>a-b);
    let best=0,run=0,previous=-Infinity;for(const w of weeks){run=w===previous+week?run+1:1;best=Math.max(best,run);previous=w}
    let active=weeks.includes(current)?current:current-week,streak=0;while(weeks.includes(active)){streak++;active-=week}
    return {played,streak,best,hours:played.length,points:played.length*100,weeks:[0,1,2,3,4,5,6,7].map(i=>({date:new Date(current-(7-i)*week).toISOString().slice(0,10),played:weeks.includes(current-(7-i)*week)}))};
  }
  function metrics(state,venue='All venues',period='all',now=Date.now()){
    const today=day(now);const start=day(now-29*86400000),end=day(now+6*86400000);
    const matches=state.matches.filter(m=>(venue==='All venues'||m.venue===venue)&&(period==='all'||period==='past30'&&m.date>=start&&m.date<=today||period==='next7'&&m.date>=today&&m.date<=end));
    const ids=new Set(matches.map(m=>m.id));const payments=state.payments.filter(p=>ids.has(p.match));
    const gross=payments.reduce((n,p)=>n+Math.round(p.amount*100),0),refunds=payments.filter(p=>p.status==='Refunded').reduce((n,p)=>n+Math.round(p.amount*100),0);
    return {matches,total:matches.length,confirmed:matches.filter(m=>m.status==='completed'||m.status==='open'&&m.joined===m.total).length,cancelled:matches.filter(m=>['cancelled','expired'].includes(m.status)).length,pending:matches.filter(m=>m.status==='open'&&m.joined<m.total).length,gross:gross/100,refunds:refunds/100,net:(gross-refunds)/100};
  }
  const api={day,monday,records,progress,metrics};if(typeof module!=='undefined')module.exports=api;else root.TrufProgress=api;
})(typeof window!=='undefined'?window:globalThis);

const KEY='truf-prototype-v1';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let state,storageWarning='';try{const raw=localStorage.getItem(KEY);state=D.normalize(raw?JSON.parse(raw):seed())}catch(error){state=D.normalize(seed());storageWarning='Saved data could not be loaded. This session uses fresh sample data; the previous stored data has not been overwritten.'}let role=location.hash==='#admin'?'admin':location.hash==='#owner'?'owner':readRole(),filter='All sports',query='',sortBy='soonest',onlyOpen=false,matchTab='upcoming';
function save(message){if(message)state.activity.unshift(new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})+' · '+message);state.activity=state.activity.slice(0,100);try{localStorage.setItem(KEY,JSON.stringify(state));storageWarning=''}catch{storageWarning='Browser storage is unavailable. Changes will be lost when this page closes.'}if(message)toast(message);if(storageWarning)toast(storageWarning)}
function toast(t){document.getElementById('toast').textContent=t;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>document.getElementById('toast').textContent='',4200)}
function route(){return location.hash.slice(1)||'discover'}
function go(p){if(route()===p)render();else location.hash=p}
const icon={discover:'◈',matches:'▦',create:'＋',profile:'◎',owner:'▤',admin:'⊞',payments:'↗'};
function render(){state.attendance=P.records(state.attendance);state.claimedRewards=Array.isArray(state.claimedRewards)?state.claimedRewards:[];let p=route();if(['player/discover','owner/discover','admin/discover'].includes(p)){role=p.split('/')[0];p='discover'}else if(p==='discover')role='player';if(p==='owner/payments'){role='owner';p='payments'}else if(p==='admin/payments'){role='admin';p='payments'}else if(p==='player/payments'){role='player';p='payments'}if(p==='admin')role='admin';else if(p==='owner')role='owner';else if(['matches','create','profile','progress'].includes(p))role='player';try{sessionStorage.setItem('truf-role',role)}catch{}let changed=JSON.stringify(state);const expired=D.expire(state);if(JSON.stringify(state)!==changed)save(expired?'Joining deadline passed. Incomplete games expired and demo refunds recorded.':null);let nav=role==='player'?[['discover','Discover'],['matches','My matches'],['progress','My progress'],['create','Create match'],['payments','My payments'],['profile','My profile']]:role==='owner'?[['owner','Owner dashboard'],['payments','Payment records'],['discover','Explore matches']]:[['admin','Admin overview'],['payments','Payment oversight'],['discover','Explore matches']];document.getElementById('app').innerHTML=`<div class="shell"><aside class="sidebar"><a class="brand" href="#${role}/discover"><span class="brand-mark">T</span>TRUF<span style="color:var(--accent)">.</span></a><div class="nav-label">Your playground</div><nav class="nav" aria-label="Main navigation">${nav.map(([id,n])=>`<a href="#${['payments','discover'].includes(id)?role+'/'+id:id}" class="${p===id?'active':''}" ${p===id?'aria-current="page"':''}><span aria-hidden="true">${icon[id]||'◇'}</span>${n}</a>`).join('')}</nav><div class="sidebar-bottom"><div class="row"><span class="avatar">${esc(state.profile.name.split(/\s+/).map(n=>n[0]).join('').slice(0,2).toUpperCase())}</span><div><strong>${esc(state.profile.name)}</strong><div class="muted">${esc(state.profile.area)}</div></div></div><p class="note">TRUF Innovators<br>Made for the love of the game.</p></div></aside><div><header class="topbar"><span class="muted">⌖ ${esc(state.profile.area)} <span style="margin:0 8px;color:#444">/</span> Your local sports community</span><div class="topbar-right"><span class="demo">INTERACTIVE DEMO</span><label class="sr" for="role" style="position:absolute;left:-9999px">Demo role</label><select id="role" style="width:auto" onchange="changeRole(this.value)"><option value="player" ${role==='player'?'selected':''}>Player view</option><option value="owner" ${role==='owner'?'selected':''}>Owner view</option><option value="admin" ${role==='admin'?'selected':''}>Admin view</option></select><span class="avatar">${esc(state.profile.name.split(/\s+/).map(n=>n[0]).join('').slice(0,2).toUpperCase())}</span></div></header><main class="content" id="main" tabindex="-1">${storageWarning?`<div class="storage-banner" role="status">${esc(storageWarning)}</div>`:''}${p==='create'?createPage():p==='profile'?profilePage():p==='progress'?progressPage():p==='owner'?ownerPage():p==='admin'?adminPage():p==='payments'?paymentsPage():p==='matches'?matchesPage():p==='discover'||p==='main'?discoverPage():notFoundPage()}</main></div></div>`;}
function changeRole(r){role=r;try{sessionStorage.setItem('truf-role',r)}catch{}go(r==='owner'?'owner':r==='admin'?'admin':'discover')}
function title(h,p,action=''){return `<div class="heading"><div><h1>${h}</h1><p class="muted">${p}</p></div>${action}</div>`}
function stats(items){return `<div class="stats">${items.map(([n,v])=>`<div class="stat"><span>${n}</span><strong>${v}</strong></div>`).join('')}</div>`}
function dateLabel(d){return new Date(d+'T12:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short'})}
function status(m){return m.status==='cancelled'?'Cancelled':m.status==='expired'?'Deadline expired':m.status==='completed'?'Completed':m.joined>=m.total?'Confirmed':'Finding players'}
function badge(m){return `<span class="badge ${D.closed(m)?'neutral':m.joined<m.total?'pending':''}">${status(m)}</span>`}
function card(m){return `<article class="card"><div class="card-top"><span class="sport">${esc(m.sport)} ${m.sport==='Football'?'· '+m.total/2+'v'+m.total/2:''}</span>${badge(m)}</div><div class="card-body"><h3>${esc(m.title)}</h3><p class="meta">⌖ ${esc(m.venue)}</p><p class="meta">▦ ${dateLabel(m.date)} <span style="margin:0 5px">·</span> ${esc(m.time)} – ${D.endTime(m.time)} IST</p><div class="progress"><i style="width:${Math.min(100,m.joined/m.total*100)}%"></i></div><div class="row roster"><span><strong style="color:var(--text)">${m.joined}/${m.total}</strong> players committed</span><span>${D.closed(m)?'Closed':m.mine?'You’re in':(m.total-m.joined)+' '+(m.total-m.joined===1?'spot':'spots')+' left'}</span></div><div class="row card-footer"><span class="price">${money(m.price)} <small>/ player</small></span><button class="small ${m.mine?'':'primary'}" onclick="details(${m.id})">${m.mine?'View match':'Match details'} ↗</button></div></div></article>`}
function filtered(){return state.matches.filter(m=>(filter==='All sports'||m.sport===filter)&&(m.title+' '+m.venue).toLowerCase().includes(query.trim().toLowerCase())&&!D.closed(m)&&(!onlyOpen||m.joined<m.total)).sort((a,b)=>sortBy==='price'?a.price-b.price:sortBy==='spots'?(a.total-a.joined)-(b.total-b.joined):D.starts(a)-D.starts(b))}
function discoverPage(){let spots=state.matches.filter(m=>!D.closed(m)).reduce((n,m)=>n+m.total-m.joined,0);return title(`Your next game starts here.`,`Find your people. Pick a match. Show up and play.`,`<button class="primary" onclick="go('create')">＋ Create match</button>`)+`<section class="hero"><div><div class="eyebrow">Less planning. More playing.</div><h2>One player short?<br>You could be the difference.</h2><p>Join a local game with a spot waiting for you. Every commitment brings the team closer.</p><button class="primary" onclick="findAlmostFull()">Find a game to complete ↗</button></div><div class="hero-metric"><span>ROOM FOR YOU</span><strong>${spots}<span style="font-size:22px;letter-spacing:0"> open spots</span></strong><span>Across your demo sports community</span><div class="progress" style="max-width:250px;margin-top:20px"><i style="width:${Math.round(state.matches.reduce((n,m)=>n+m.joined,0)/Math.max(1,state.matches.reduce((n,m)=>n+m.total,0))*100)}%"></i></div></div></section>`+stats([['Open matches',state.matches.filter(m=>!D.closed(m)&&m.joined<m.total).length],['Your upcoming games',state.matches.filter(m=>m.mine&&!D.closed(m)).length],['Your commitments',money(state.payments.filter(p=>p.status==='Paid').reduce((n,p)=>n+p.amount,0))]])+`<div class="section-head"><h2>Find your next match</h2><span class="muted" style="font-size:14px">All skill levels welcome</span></div><div class="filters">${['All sports','Football','Cricket','Badminton'].map(s=>`<button aria-pressed="${filter===s}" class="chip ${filter===s?'active':''}" onclick="setFilter('${s}')">${s}</button>`).join('')}<input class="search" aria-label="Search matches or venues" placeholder="Search match or venue…" value="${esc(query)}" oninput="searchMatches(this.value)"></div><div class="toolbar"><span id="resultCount" class="muted" aria-live="polite">${filtered().length} matches</span><label>Sort by <select aria-label="Sort matches" onchange="sortBy=this.value;refreshCards()"><option value="soonest" ${sortBy==='soonest'?'selected':''}>Soonest</option><option value="price" ${sortBy==='price'?'selected':''}>Lowest price</option><option value="spots" ${sortBy==='spots'?'selected':''}>Fewest spots left</option></select></label><label><input type="checkbox" ${onlyOpen?'checked':''} onchange="onlyOpen=this.checked;refreshCards()"> Open places only</label></div><div id="cards" class="grid">${filtered().map(card).join('')||'<div class="empty">No matches found. Try another sport or venue.</div>'}</div><p class="note">Sample community data · Payments are simulated · Changes are saved in this browser only</p>`}
function setFilter(s){filter=s;render()}function searchMatches(q){query=q;refreshCards()}function refreshCards(){document.getElementById('cards').innerHTML=filtered().map(card).join('')||'<div class="empty"><h3>No matching games</h3><p>Try another sport or clear your search.</p><button onclick="clearFilters()">Clear filters</button></div>';document.getElementById('resultCount').textContent=filtered().length+' matches'}function clearFilters(){filter='All sports';query='';onlyOpen=false;render()}
function findAlmostFull(){let m=state.matches.filter(m=>!D.closed(m)&&D.deadline(m)>Date.now()&&!m.mine&&m.joined<m.total).sort((a,b)=>(a.total-a.joined)-(b.total-b.joined))[0];m?details(m.id):toast('No open matches right now. Create a new game.')}
function matchesPage() {
  const list = state.matches.filter(m => (m.mine || m.host || m.wasMine) && (matchTab === 'history' ? D.closed(m) || (!m.mine && !m.host) : !D.closed(m) && (m.mine || m.host)));
  return title('Your games, all together.', 'Upcoming games and a lasting record of your commitments.') +
    '<div class="filters"><button class="chip '+(matchTab==='upcoming'?'active':'')+'" onclick="matchTab=&quot;upcoming&quot;;render()">Upcoming & organizing</button><button class="chip '+(matchTab==='history'?'active':'')+'" onclick="matchTab=&quot;history&quot;;render()">History & withdrawals</button><button class="primary" onclick="go(&quot;create&quot;)">Create match</button></div><div class="grid">'+list.map(card).join('')+'</div>'+
    (!list.length?'<div class="empty"><h2>No games in this view yet.</h2><p>Explore Discover to find your next game.</p><button onclick="go(&quot;discover&quot;)">Explore matches</button></div>':'');
}
function openModal(html){const d=document.getElementById('modal');if(!d.open)window.dialogTrigger=document.activeElement;d.innerHTML=`<button class="close small" aria-label="Close dialog" onclick="closeModal()">✕</button>`+html;const heading=d.querySelector('h2');if(heading){heading.id='dialogTitle';d.setAttribute('aria-labelledby','dialogTitle')}if(!d.open)d.showModal();else d.querySelector('button').focus()}
function closeModal(){document.getElementById('modal').close();if(window.dialogTrigger?.isConnected)window.dialogTrigger.focus()}
function details(id){let m=state.matches.find(x=>x.id===id);if(!m){toast('Match no longer exists.');return}openModal(`<div class="eyebrow">${esc(m.sport)} · MATCH DETAILS</div><h2>${esc(m.title)}</h2><p class="muted">${esc(m.venue)}<br>${dateLabel(m.date)} · ${esc(m.time)}–${D.endTime(m.time)} IST</p>${badge(m)}<div class="progress"><i style="width:${m.joined/m.total*100}%"></i></div><p>${m.joined} of ${m.total} committed · ${money(m.price)} per player</p><div class="notice"><strong>Joining deadline: ${deadlineLabel(m)}</strong><br>One hour before play. Incomplete games expire when this app next checks the deadline. Demo payments are refunded locally.</div><p class="muted">Full demo refund before start time. Withdrawing after the deadline can expire an incomplete game. No real money is collected.</p><div class="actions">${m.wasMine||m.mine?'<button onclick="closeModal();go(&quot;player/payments&quot;)">Payment history</button>':''}${D.closed(m)?'<button onclick="closeModal()">Close</button>':m.mine?`<button class="danger" ${D.starts(m)<=Date.now()?'disabled':''} onclick="confirmWithdraw(${id})">Withdraw & refund</button>`:m.joined<m.total&&D.deadline(m)>Date.now()?`<button class="primary" onclick="checkout(${id})">Join · ${money(m.price)}</button>`:'<button disabled>Joining closed</button>'}${m.host&&!D.closed(m)?`<button onclick="editMatch(${id})">Edit name</button><button class="danger" onclick="confirmCancel(${id})">Cancel match</button>`:''}</div>`)}
function deadlineLabel(m){return new Date(D.deadline(m)).toLocaleString('en-IN',{timeZone:'Asia/Kolkata',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})+' IST'}
function editMatch(id){const m=state.matches.find(m=>m.id===id);if(!m?.host||D.closed(m))return;openModal(`<h2>Edit match name</h2><p class="muted">Sport, price, and slot stay fixed to protect existing commitments.</p><form onsubmit="saveMatchName(event,${id})"><div class="field"><label for="editTitle">Match name</label><input id="editTitle" name="title" maxlength="70" required value="${esc(m.title)}"></div><p id="editError" class="danger" role="alert"></p><button class="primary">Save name</button></form>`)}
function saveMatchName(e,id){e.preventDefault();try{const m=state.matches.find(m=>m.id===id);if(!m?.host||D.closed(m))throw Error('This match can no longer be edited.');m.title=D.text(new FormData(e.target).get('title'),'Match name',70);save('Match name updated.');closeModal();render()}catch(err){document.getElementById('editError').textContent=err.message}}
function checkout(id){let m=state.matches.find(x=>x.id===id);openModal(`<div class="eyebrow">DEMO CHECKOUT</div><h2>Make your commitment.</h2><p class="muted">${esc(m.title)}</p><div class="panel"><div class="row"><span>Your place</span><strong>${money(m.price)}</strong></div><div class="row" style="margin-top:12px"><span>Demo service fee</span><span>₹0</span></div></div><div class="notice">This is a local payment simulation, not Razorpay checkout. Do not enter card or bank details. No money will be charged.</div><label><input type="checkbox" id="terms" style="width:18px;min-height:18px;vertical-align:middle"> I understand this is a demo and accept the demo cancellation policy.</label><div class="actions"><button onclick="paymentFailure()">Simulate failure</button><button class="primary" onclick="pay(${id})">Simulate payment</button></div><p id="payError" role="alert" style="color:#ffb5b5;margin-top:14px"></p>`)}
function paymentFailure(){document.getElementById('payError').textContent='Demo payment failed. Your place was not charged. You can retry.'}
function pay(id){if(!document.getElementById('terms').checked){document.getElementById('payError').textContent='Accept the demo policy to continue.';return}try{let m=D.join(state,id);state.payments.unshift({id:Date.now(),match:id,title:m.title,amount:m.price,status:'Paid',date:new Date().toLocaleDateString('en-IN'),createdAt:new Date().toISOString()});save(m.joined===m.total?'Team complete! Your demo booking is confirmed.':'You’re in! Your demo commitment is recorded.');closeModal();render()}catch(err){document.getElementById('payError').textContent=err.message}}
function confirmWithdraw(id){openModal(`<h2>Leave this match?</h2><p>Your place will reopen for another player and your demo payment will be marked refunded.</p><div class="actions"><button onclick="closeModal()">Keep my place</button><button class="danger" onclick="withdraw(${id})">Withdraw & refund</button></div>`)}
function withdraw(id){try{D.withdraw(state,id);save('Place released. Demo refund completed.')}catch(err){toast(err.message)}closeModal();render()}
function createPage(){return title('Bring a game together.','Choose your sport, reserve a demo slot, and invite players.')+`<div class="two"><form class="panel" onsubmit="createMatch(event)"><h2>Match details</h2><div class="field"><label for="matchTitle">Match name</label><input id="matchTitle" name="title" aria-describedby="createError" required maxlength="70" placeholder="e.g. Friday night football"></div><div class="form-grid"><div class="field"><label for="sport">Sport</label><select id="sport" name="sport" onchange="updateSportSlots()"><option>Football</option><option>Cricket</option><option>Badminton</option></select></div><div class="field"><label for="total">Players needed</label><input id="total" name="total" aria-describedby="createError" type="number" min="2" max="30" value="12" required></div></div><div class="field"><label for="slot">Available venue & slot</label><select name="slot" id="slot" required><option value="">Choose an available slot</option>${state.slots.filter(s=>s.sport==='Football'&&D.available(s,state)).map(s=>`<option value="${s.id}">${esc(s.venue)} · ${dateLabel(s.date)} ${s.time} · ${money(s.price)}</option>`).join('')}</select></div><p id="slotHint" class="muted">Slots are filtered for the selected sport. Dates and times use IST.</p><div class="notice">The total slot price is divided equally. Your own place is not committed until you join and complete demo checkout.</div><p id="createError" role="alert" class="danger"></p><button class="primary" type="submit">Create match ↗</button></form><aside class="panel"><div class="eyebrow">MATCH COMMITMENT</div><h2>A clear path to kick-off.</h2><p>1. Choose an available slot.</p><p>2. Players join and commit their share.</p><p>3. A full paid roster confirms the game.</p><button type="button" onclick="changeRole('owner')">Manage demo slots ↗</button><p class="note">Need another slot? Switch to Owner view and add one. Slot reservation and role permissions here are demonstrations, not a production booking guarantee.</p></aside></div>`}
function createMatch(e){e.preventDefault();try{const f=new FormData(e.target);state.matches.unshift(D.create({id:Date.now(),title:f.get('title'),sport:f.get('sport'),total:f.get('total'),slot:f.get('slot')},state));save('Match created. Join it to commit your own place.');go('matches')}catch(err){document.getElementById('createError').textContent=err.message}}
function paymentsPage(){return title(role==='player'?'Your payment history.':'Payment oversight.','Demo transactions only. No real money has moved.')+stats([['Demo collected',money(state.payments.filter(p=>p.status==='Paid').reduce((n,p)=>n+p.amount,0))],['Demo refunded',money(state.payments.filter(p=>p.status==='Refunded').reduce((n,p)=>n+p.amount,0))],['Transactions',state.payments.length]])+`<div class="panel table-wrap"><table><thead><tr><th>Reference</th><th>Match</th><th>Date</th><th>Amount</th><th>Status</th><th>Receipt</th></tr></thead><tbody>${state.payments.map(p=>`<tr><td>DEMO-${String(p.id).slice(-6)}</td><td>${esc(p.title)}</td><td>${esc(p.date)}</td><td>${money(p.amount)}</td><td><span class="badge ${p.status==='Refunded'?'neutral':''}">${p.status}</span></td><td><button class="small" onclick="receipt(${p.id})">View receipt</button></td></tr>`).join('')}</tbody></table>${!state.payments.length?'<div class="empty">No transactions yet. Join a match to try demo checkout.</div>':''}</div><p class="note">Owner and admin views intentionally share the same sample data in this prototype. Production access control is not implemented.</p>`}
function baseOwnerPage(){return title('Your turf. Your control.','Manage sample playing areas and bookings. All owner data is shared in this demo.',`<button class="primary" onclick="addSlotDialog()">＋ Add slot</button>`)+metricsPanel()+`<section class="panel"><h2>Availability calendar</h2><div class="table-wrap"><table><thead><tr><th>Venue</th><th>Date & time</th><th>Price</th><th>Status</th><th>Action</th></tr></thead><tbody>${state.slots.map(s=>{let reserved=state.matches.some(m=>m.slot===s.id&&!D.closed(m));return `<tr><td>${esc(s.venue)}<br><span class="muted">${esc(s.sport)}</span></td><td>${dateLabel(s.date)} · ${s.time}</td><td>${money(s.price)}</td><td><span class="badge ${reserved?'pending':s.blocked?'neutral':''}">${reserved?(state.matches.some(m=>m.slot===s.id&&!D.closed(m)&&m.joined===m.total)?'Confirmed':'Held by match'):D.deadline(s)<=Date.now()?'Past deadline':s.blocked?'Blocked':'Available'}</span></td><td><button class="small" ${reserved||D.deadline(s)<=Date.now()?'disabled':''} onclick="toggleSlot(${s.id})">${s.blocked?'Reopen':'Block'}</button></td></tr>`}).join('')}</tbody></table></div></section><section class="panel"><h2>Match bookings</h2>${bookingTable()}</section>`}
function bookingTable(){return `<div class="table-wrap"><table><thead><tr><th>Match</th><th>Venue</th><th>Players</th><th>Status</th><th>Action</th></tr></thead><tbody>${state.matches.map(m=>`<tr><td><button class="small" onclick="details(${m.id})">${esc(m.title)}</button></td><td>${esc(m.venue)}</td><td>${m.joined}/${m.total}</td><td>${badge(m)}</td><td><button class="small danger" ${D.closed(m)?'disabled':''} onclick="confirmCancel(${m.id})">Cancel</button></td></tr>`).join('')}</tbody></table></div>`}
function toggleSlot(id){let s=state.slots.find(s=>s.id===id);if(!s||state.matches.some(m=>m.slot===id&&!D.closed(m))){toast('A reserved slot cannot be blocked.');return}s.blocked=!s.blocked;save(s.blocked?'Slot blocked.':'Slot reopened.');render()}
function addSlotDialog(){openModal(`<h2>Add an available slot</h2><form onsubmit="addSlot(event)"><div class="field"><label for="venue">Venue name and locality</label><input id="venue" name="venue" aria-describedby="slotError" maxlength="80" required placeholder="e.g. The Arena · Court 1"></div><div class="field"><label for="slotSport">Sport</label><select id="slotSport" name="sport"><option>Football</option><option>Cricket</option><option>Badminton</option></select></div><div class="form-grid"><div class="field"><label for="date">Date</label><input id="date" type="date" name="date" min="${new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Kolkata'})}" value="${tomorrow()}" required></div><div class="field"><label for="time">Start time (one-hour slot)</label><input id="time" type="time" name="time" max="23:59" required></div></div><div class="field"><label for="price">Total price (₹)</label><input id="price" type="number" name="price" min="100" max="50000" step="1" required></div><p id="slotError" role="alert" class="danger"></p><button class="primary">Save slot</button></form>`)}
function addSlot(e){e.preventDefault();try{let f=new FormData(e.target);state.slots.push(D.validateSlot({id:Date.now(),venue:f.get('venue'),sport:f.get('sport'),date:f.get('date'),time:f.get('time'),price:f.get('price')},state));save('New slot added to availability.');closeModal();render()}catch(err){document.getElementById('slotError').textContent=err.message}}
function confirmCancel(id){openModal(`<h2>Cancel this match?</h2><p>Players will lose their demo reservation. Recorded demo payments will be refunded and the slot released.</p><div class="actions"><button onclick="closeModal()">Keep match</button><button class="danger" onclick="cancelMatch(${id})">Cancel & refund</button></div>`)}
function cancelMatch(id){try{const m=state.matches.find(m=>m.id===id);if(role==='player'&&!m?.host)throw Error('Switch to an owner/admin demo view to manage other matches.');D.cancel(state,id);save('Match cancelled and recorded demo payments refunded.')}catch(err){toast(err.message)}closeModal();render()}
function adminPage(){return title('The community, at a glance.','Approve venues, review bookings, and follow platform activity.')+metricsPanel()+`<div class="notice">Admin preview: the role switcher demonstrates navigation only. This prototype has no authentication, secure permissions, or shared server database.</div><section class="panel"><h2>Owner applications</h2><div class="table-wrap"><table><thead><tr><th>Business</th><th>Locality</th><th>Status</th><th>Review</th></tr></thead><tbody>${state.owners.map(o=>`<tr><td>${esc(o.name)}</td><td>${esc(o.area)}</td><td><span class="badge ${o.status==='Pending'?'pending':'neutral'}">${o.status}</span></td><td>${o.status==='Pending'?`<button class="small primary" onclick="reviewOwner(${o.id},'Approved')">Approve</button> <button class="small" onclick="reviewOwner(${o.id},'Rejected')">Reject</button>`:'Reviewed'}</td></tr>`).join('')}</tbody></table></div></section><section class="panel"><h2>Booking oversight</h2>${bookingTable()}</section><section class="panel"><h2>Activity log</h2>${state.activity.slice(0,12).map(a=>`<div class="activity">${esc(a)}</div>`).join('')}</section>`}
function reviewOwner(id,status){state.owners.find(o=>o.id===id).status=status;save('Owner application '+status.toLowerCase()+'.');render()}
function profilePage(){return title('Make it your game.','Your preferences stay in this browser.')+`<div class="two"><form class="panel" onsubmit="updateProfile(event)"><h2>Player profile</h2><div class="field"><label for="name">Display name</label><input id="name" name="name" aria-describedby="profileError" required maxlength="40" value="${esc(state.profile.name)}"></div><div class="field"><label for="area">City or locality</label><input id="area" name="area" required maxlength="60" value="${esc(state.profile.area)}"></div><div class="field"><label for="favorite">Favorite sport</label><select id="favorite" name="sport">${['Football','Cricket','Badminton'].map(s=>`<option ${s===state.profile.sport?'selected':''}>${s}</option>`).join('')}</select></div><p id="profileError" role="alert" class="danger"></p><button class="primary">Save preferences</button></form><aside class="panel"><h2>About this prototype</h2><p class="muted">Try every role from the menu at the top. Match commitments, refunds, owner approval, and slot changes persist locally.</p><p class="muted">Payments are simulations. Seed players are fictional. Deadlines update while the app is open or when it is reopened. No real bookings, messages, or charges are made. Multiple-tab updates are synchronized, but this is not a concurrent multi-user booking system.</p><button class="danger" onclick="resetDialog()">Reset demo data</button></aside></div>`}
function updateProfile(e){e.preventDefault();try{let f=new FormData(e.target);state.profile={name:D.text(f.get('name'),'Display name',40),area:D.text(f.get('area'),'Locality',60),sport:f.get('sport')};save('Profile preferences saved.');render()}catch(err){document.getElementById('profileError').textContent=err.message}}
function resetDialog(){openModal(`<h2>Reset this demo?</h2><p>This removes your local demo matches, payments, and preferences and restores the sample data.</p><div class="actions"><button onclick="closeModal()">Keep data</button><button class="danger" onclick="resetDemo()">Reset demo</button></div>`)}
function resetDemo(){state=D.normalize(seed());save('Demo reset.');closeModal();filter='All sports';query='';role='player';go('discover')}

function updateSportSlots(){const sport=document.getElementById('sport').value;document.getElementById('total').value=sport==='Badminton'?4:12;const slots=state.slots.filter(s=>s.sport===sport&&D.available(s,state));document.getElementById('slot').innerHTML='<option value="">Choose an available slot</option>'+slots.map(s=>'<option value="'+s.id+'">'+esc(s.venue)+' · '+dateLabel(s.date)+' '+s.time+' · '+money(s.price)+'</option>').join('');document.getElementById('slotHint').textContent=slots.length?'Choose a '+sport.toLowerCase()+' slot. Dates and times use IST.':'No '+sport.toLowerCase()+' slots available. Add one in Owner view.'}
function receipt(id){const p=state.payments.find(p=>p.id===id);if(!p)return;openModal(`<div class="eyebrow">DEMO RECEIPT · NO REAL CHARGE</div><h2>Payment record</h2><div class="receipt"><div class="row"><span>Reference</span><strong>DEMO-${p.id}</strong></div><div class="row"><span>Match at checkout</span><strong>${esc(p.title)}</strong></div><div class="row"><span>Amount</span><strong>${money(p.amount)}</strong></div><div class="row"><span>Status</span><strong>${esc(p.status)}</strong></div><div class="row"><span>Date</span><span>${esc(p.date)}</span></div></div>${p.reason?'<p class="note">'+esc(p.reason)+'</p>':''}<p class="notice">This local record is not a tax invoice or a payment provider receipt.</p><div class="actions"><button onclick="details(${p.match})">View match</button><button onclick="closeModal()">Done</button></div>`)}
function notFoundPage(){return title('Page not found.','This prototype page does not exist.')+'<button class="primary" onclick="go(&quot;discover&quot;)">Back to Discover</button>'}
window.addEventListener('hashchange',()=>{if(document.getElementById('modal').open)closeModal();render();window.scrollTo(0,0)});
window.addEventListener('storage',event=>{if(event.key!==KEY)return;try{state=D.normalize(event.newValue?JSON.parse(event.newValue):seed());closeModal();render();toast('Demo updated from another tab.')}catch{toast('Another tab saved unreadable data. Your current view was kept.')}});
document.getElementById('modal').addEventListener('cancel',()=>{if(window.dialogTrigger?.isConnected)window.dialogTrigger.focus()});
document.querySelector('.skip').addEventListener('click',event=>{event.preventDefault();document.getElementById('main').focus()});
setInterval(()=>{if(document.hidden||document.getElementById('modal').open)return;const before=JSON.stringify(state);D.expire(state);if(before!==JSON.stringify(state)){save('Match deadlines updated.');render()}},30000);
const P=TrufProgress;
let metricVenue='All venues',metricPeriod='all',progressSport='All sports',previewProgress=false;
function metricsPanel(){
 const venues=[...new Set([...state.matches,...state.slots].map(m=>m.venue))];if(!venues.includes(metricVenue))metricVenue='All venues';
 const v=P.metrics(state,metricVenue,metricPeriod);
 return `<section class="panel"><div class="section-head" style="margin-top:0"><h2>Booking metrics</h2><span class="demo">DEMO DATA</span></div><div class="toolbar"><label>Playing area <select aria-label="Metrics venue" onchange="metricVenue=this.value;render()"><option>All venues</option>${venues.map(n=>`<option ${n===metricVenue?'selected':''}>${esc(n)}</option>`).join('')}</select></label><label>Match dates <select aria-label="Metrics period" onchange="metricPeriod=this.value;render()"><option value="all" ${metricPeriod==='all'?'selected':''}>All dates</option><option value="past30" ${metricPeriod==='past30'?'selected':''}>Past 30 days</option><option value="next7" ${metricPeriod==='next7'?'selected':''}>Next 7 days</option></select></label></div>${stats([['Matches created',v.total],['Confirmed / completed',v.confirmed],['Cancelled / expired',v.cancelled]])}${stats([['Recorded demo payments',money(v.gross)],['Demo refunds',money(v.refunds)],['Net demo collections',money(v.net)]])}<p class="note">${v.pending} waiting for players. Filtered by scheduled match date (IST). Collections count recorded demo payments only—not fictional seed players, settlement income, or profit. Venue filters demonstrate reporting; they are not owner access controls.</p><div class="table-wrap"><table><thead><tr><th>Sport</th><th>Matches</th><th>Confirmed / completed</th></tr></thead><tbody>${D.sports.map(s=>{let list=v.matches.filter(m=>m.sport===s);return `<tr><td>${s}</td><td>${list.length}</td><td>${list.filter(m=>m.status==='completed'||m.status==='open'&&m.joined===m.total).length}</td></tr>`}).join('')}</tbody></table></div><button style="margin-top:16px" onclick="go(role+'/payments')">Open payment records ↗</button></section>`;
}
function sampleAttendance(){const week=P.monday(P.day(Date.now()));return [0,1,2].map((n)=>({match:-n-1,date:new Date(week-n*604800000).toISOString().slice(0,10),sport:'Football',title:'Sample football game'}))}
function progressPage(){
 const rows=previewProgress?sampleAttendance():state.attendance||[],p=P.progress(rows,progressSport),overall=P.progress(rows);
 const rewards=[{id:'first-game',name:'First game',description:'Attend your first game',goal:1,value:overall.played.length},{id:'three-weeks',name:'Finding your rhythm',description:'Play in 3 consecutive weeks',goal:3,value:overall.best},{id:'five-games',name:'Regular player',description:'Attend 5 games',goal:5,value:overall.played.length}];
 return title('Your game. Your progress.','A simple record of showing up and playing.')+`<div class="toolbar"><label>Sport <select aria-label="Progress sport" onchange="progressSport=this.value;render()">${['All sports',...D.sports].map(s=>`<option ${s===progressSport?'selected':''}>${s}</option>`).join('')}</select></label><label><input type="checkbox" ${previewProgress?'checked':''} onchange="previewProgress=this.checked;render()"> Preview sample progress</label></div>${previewProgress?'<div class="notice">SAMPLE PREVIEW · These three fictional games are not saved. Reward claims are disabled in this view.</div>':''}${stats([['Games attended',p.played.length],['Current weekly streak',p.streak+' weeks'],['Play points',p.points]])}<div class="two"><section class="panel"><h2>Keep your weekly streak going</h2><p class="muted">Play at least once each Monday–Sunday week. A current streak can continue from last week until this week ends. Dates use IST.</p><div class="week-grid">${p.weeks.map(w=>`<div class="week-box ${w.played?'played':''}" title="Week starting ${w.date}"><span>${w.played?'✓':'—'}</span><small>${dateLabel(w.date)}</small></div>`).join('')}</div><p class="note">Best streak: ${p.best} weeks · ${p.hours} hours recorded (one-hour games). Only owner-marked attendance earns 100 points per game.</p><button onclick="go('discover')">Find your next game ↗</button></section><section class="panel"><h2>Your sport record</h2>${D.sports.map(s=>{const n=P.progress(rows,s).played.length;return `<div class="activity row"><span>${s}</span><strong>${n} ${n===1?'game':'games'}</strong></div>`}).join('')}<p class="note">Paid, cancelled, expired, and unverified bookings do not award play points.</p></section></div><section class="panel"><h2>Rewards to work toward</h2><p class="muted">All-sport achievements. Collectible demo badges only—no cash value or discounts.</p><div class="grid">${rewards.map(r=>{const unlocked=r.value>=r.goal,claimed=(state.claimedRewards||[]).includes(r.id)&&!previewProgress;return `<article class="card"><div class="card-body" style="padding-top:20px"><span class="badge ${unlocked?'':'neutral'}">${claimed?'Collected':unlocked?'Unlocked':'In progress'}</span><h3 style="margin-top:12px">${r.name}</h3><p class="meta">${r.description}</p><div class="progress"><i style="width:${Math.min(100,r.value/r.goal*100)}%"></i></div><p class="meta">${Math.min(r.value,r.goal)} / ${r.goal}</p><button class="small primary" ${!unlocked||claimed||previewProgress?'disabled':''} onclick="claimReward('${r.id}')">${claimed?'Badge collected':previewProgress?'Sample badge':'Collect badge'}</button></div></article>`}).join('')}</div></section><section class="panel"><h2>Played games</h2>${p.played.length?`<div class="table-wrap"><table><thead><tr><th>Game</th><th>Sport</th><th>Date</th><th>Points</th></tr></thead><tbody>${p.played.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(r=>`<tr><td>${esc(r.title)}</td><td>${esc(r.sport)}</td><td>${dateLabel(r.date)}</td><td>+100</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No attended games yet. After a completed game, the turf owner can record your attendance in Owner view.</div>'}</section>`;
}
function attendancePanel(){const eligible=state.matches.filter(m=>m.status==='completed'&&m.mine);return `<section class="panel"><h2>Player attendance</h2><p class="muted">Record the demo player’s attendance after a completed, fully committed game. This updates player streaks, records, and rewards.</p>${eligible.length?`<div class="table-wrap"><table><thead><tr><th>Game</th><th>Date</th><th>Attendance</th></tr></thead><tbody>${eligible.map(m=>{const done=(state.attendance||[]).some(r=>r.match===m.id);return `<tr><td>${esc(m.title)}</td><td>${dateLabel(m.date)}</td><td><button class="small" ${done?'disabled':''} onclick="confirmAttendance(${m.id})">${done?'Attendance recorded':'Mark attended'}</button></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">No completed games with this player awaiting attendance. Bookings alone do not count as play.</div>'}<button style="margin-top:16px" onclick="go('progress')">View player progress ↗</button></section>`}
function confirmAttendance(id){if(role!=='owner'&&role!=='admin')return;const m=state.matches.find(m=>m.id===id);if(!m||!m.mine||m.status!=='completed')return;openModal(`<h2>Record attendance?</h2><p>Confirm that the demo player attended ${esc(m.title)}. This awards 100 play points and updates their weekly streak.</p><div class="actions"><button onclick="closeModal()">Back</button><button class="primary" onclick="recordAttendance(${id})">Confirm attended</button></div>`)}
function recordAttendance(id){const m=state.matches.find(m=>m.id===id);if(!['owner','admin'].includes(role)||!m?.mine||m.status!=='completed'||D.starts(m)+3600000>Date.now())return;state.attendance=P.records(state.attendance);if(state.attendance.some(r=>r.match===id)){closeModal();return}state.attendance.push({match:id,date:m.date,sport:m.sport,title:m.title});save('Attendance recorded. Player earned 100 demo play points.');closeModal();render()}
function claimReward(id){if(previewProgress)return;const p=P.progress(state.attendance||[]),eligible={'first-game':p.played.length>=1,'three-weeks':p.best>=3,'five-games':p.played.length>=5};if(!eligible[id])return;state.claimedRewards=Array.isArray(state.claimedRewards)?state.claimedRewards:[];if(state.claimedRewards.includes(id))return;state.claimedRewards.push(id);save('Achievement badge collected!');render()}

function ownerPage(){return baseOwnerPage()+attendancePanel()}
render();
</script></body></html>
