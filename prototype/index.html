<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TRUF — Find your next game</title>
<style>
:root{color-scheme:dark;--bg:#101115;--panel:#191a21;--line:#2b2d38;--muted:#a6a8ba;--text:#f4f4fa;--accent:#b7a0ff;--green:#ace7bf}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 Inter,Segoe UI,Arial,sans-serif}button,input,select{font:inherit}button,a,input,select{outline-offset:4px}button:focus-visible,a:focus-visible{outline:3px solid var(--accent)}button{cursor:pointer}a{color:inherit;text-decoration:none}button{border:1px solid var(--line);background:#242630;color:var(--text);padding:10px 16px;border-radius:10px;font-weight:600}button:hover{background:#34313f}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:var(--accent);color:#20153b;border-color:transparent}.primary:hover{background:#cbb9ff}.danger{color:#ffb5b5}.small{font-size:14px;padding:7px 12px}.muted{color:var(--muted)}.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}.sidebar{border-right:1px solid var(--line);padding:30px 20px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}.brand{font-weight:900;letter-spacing:-2px;font-size:36px;display:flex;gap:10px;align-items:center}.brand-mark{font-size:26px;background:var(--accent);color:#211b33;border-radius:10px;line-height:38px;width:38px;text-align:center;letter-spacing:0;transform:skew(-8deg)}.brand small{font-size:11px;letter-spacing:1px}.nav-label{text-transform:uppercase;letter-spacing:2px;font-size:12px;color:var(--muted);margin:38px 12px 10px}.nav{display:flex;flex-direction:column;gap:7px}.nav a{padding:12px 14px;border-radius:10px;color:var(--muted);font-size:15px;display:flex;gap:12px}.nav a.active{background:#2e273f;color:#d4c6ff}.nav a:hover{background:#252630}.sidebar-bottom{margin-top:auto;border-top:1px solid var(--line);padding-top:20px;font-size:14px}.avatar{border-radius:50%;background:#373043;color:#d3c4ff;width:38px;height:38px;display:inline-grid;place-items:center;font-size:13px;font-weight:700}.topbar{padding:18px 38px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px}.topbar-right{display:flex;align-items:center;gap:14px}.demo{font-size:12px;letter-spacing:.7px;padding:5px 9px;border:1px solid #514366;color:#d8c8ff;border-radius:6px}.content{max-width:1440px;margin:auto;padding:32px 38px 50px}.heading{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:26px}h1{font-size:30px;line-height:1.2;letter-spacing:-1px;margin:0 0 8px}h2{font-size:20px;margin:0 0 16px;letter-spacing:-.4px}h3{margin:0 0 8px;font-size:19px}p{margin:0 0 14px}.eyebrow{text-transform:uppercase;font-size:12px;letter-spacing:2px;color:#d0bfff;margin-bottom:12px}.hero{background:linear-gradient(110deg,#302445,#232031 70%);border:1px solid #4b3b63;border-radius:18px;padding:28px 32px;display:grid;grid-template-columns:1.5fr 1fr;gap:30px;margin-bottom:26px}.hero h2{font-size:29px;max-width:460px;line-height:1.25}.hero p{color:#c1b9d3;max-width:460px}.hero-metric{display:flex;justify-content:center;flex-direction:column;border-left:1px solid #514460;padding-left:35px}.hero-metric strong{font-size:48px;letter-spacing:-2px;line-height:1.1}.hero-metric span{color:#c1b9d3}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:28px}.stat{padding:19px 22px;background:var(--panel);border:1px solid var(--line);border-radius:13px}.stat span{font-size:14px;color:var(--muted)}.stat strong{font-size:28px;display:block;margin-top:7px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:24px 0 16px}.section-head h2{margin:0}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.chip{border-radius:30px;font-size:14px;padding:8px 17px}.chip.active{background:var(--accent);border-color:var(--accent);color:#231735}.search{margin-left:auto;max-width:260px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;overflow:hidden}.card-top{padding:18px 20px 12px;display:flex;align-items:center;justify-content:space-between;gap:6px}.sport{font-size:12px;letter-spacing:1.3px;text-transform:uppercase;font-weight:700;color:var(--accent)}.badge{display:inline-block;font-size:12px;border-radius:6px;padding:4px 8px;background:#27352e;color:var(--green)}.badge.pending{color:#e2c996;background:#3a3225}.badge.neutral{color:#c1bfd0;background:#30303b}.card-body{padding:8px 20px 20px}.meta{font-size:14px;color:var(--muted);margin:8px 0}.progress{height:5px;background:#343441;border-radius:5px;overflow:hidden;margin:12px 0 8px}.progress i{height:100%;display:block;background:var(--accent)}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.roster{font-size:13px;color:var(--muted)}.card-footer{padding-top:16px;margin-top:16px;border-top:1px solid var(--line)}.price{font-size:21px;font-weight:700}.price small{font-size:12px;color:var(--muted);font-weight:400}.note{font-size:13px;color:var(--muted);margin-top:22px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;margin-bottom:20px}.two{display:grid;grid-template-columns:1.5fr 1fr;gap:22px}label{display:block;font-size:14px;margin:0 0 7px}input,select{width:100%;background:#111218;border:1px solid #444654;color:var(--text);padding:11px 12px;border-radius:9px;min-height:44px}input:focus,select:focus{outline:2px solid var(--accent)}.field{margin-bottom:18px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:15px 12px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted);font-weight:500}.empty{text-align:center;padding:45px 25px;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}dialog{background:var(--panel);color:var(--text);border:1px solid #4c435e;border-radius:18px;padding:26px;max-width:510px;width:calc(100% - 30px)}dialog::backdrop{background:#06060bbb;backdrop-filter:blur(4px)}dialog h2{padding-right:35px}.close{position:absolute;right:16px;top:14px}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:24px}.notice{background:#272235;border:1px solid #514365;border-radius:10px;padding:13px;font-size:14px;color:#d0c2e7;margin:15px 0}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#e2d8ff;color:#20182c;border-radius:10px;padding:13px 22px;z-index:5;box-shadow:0 10px 40px #0008;max-width:90vw}#toast:empty{display:none}.activity{padding:13px 0;border-bottom:1px solid var(--line);font-size:14px}.check{color:var(--green)}.mobile-brand{display:none}@media(min-width:1450px){.content{padding-top:40px}.grid{gap:24px}}@media(max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.shell{grid-template-columns:200px 1fr}.content{padding:25px}.topbar{padding:16px 25px}.hero h2{font-size:25px}}@media(max-width:760px){.shell{display:block}.sidebar{height:auto;position:static;padding:12px 16px;border-right:0;border-bottom:1px solid var(--line)}.brand{font-size:27px}.brand-mark{font-size:20px;width:30px;line-height:30px}.nav-label,.sidebar-bottom{display:none}.nav{flex-direction:row;overflow:auto;margin-top:10px;gap:4px}.nav a{white-space:nowrap;font-size:13px;padding:8px 10px}.topbar{padding:12px 16px;font-size:13px}.topbar-right{gap:8px}.topbar .avatar{display:none}.topbar select{padding:7px;min-height:36px;font-size:13px}.content{padding:24px 16px}.heading{align-items:flex-start}h1{font-size:26px}.heading p{font-size:14px}.heading button{font-size:13px;padding:9px}.hero{padding:22px;grid-template-columns:1fr}.hero-metric{display:none}.stats{gap:8px}.stat{padding:12px}.stat span{font-size:12px}.stat strong{font-size:23px}.grid,.two{grid-template-columns:1fr}.search{max-width:none;margin-left:0;width:100%}.form-grid{grid-template-columns:1fr}.panel{padding:18px}.hero h2{font-size:26px}.demo{font-size:10px}.topbar-right label{margin:0}.card h3{font-size:20px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body><div id="app"></div><dialog id="modal"></dialog><div id="toast" role="status" aria-live="polite"></div>
<script>
const KEY='truf-prototype-v1';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'₹'+Number(n).toLocaleString('en-IN');
const tomorrow=()=>{let d=new Date();d.setDate(d.getDate()+1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function seed(){return {profile:{name:'Praveen',area:'Chennai',sport:'Football'},matches:[{id:1,title:'After-hours football',sport:'Football',venue:'The Arena · Velachery',date:tomorrow(),time:'19:00',total:12,joined:10,price:100,mine:false,host:false,status:'open'},{id:2,title:'Weekend cricket crew',sport:'Cricket',venue:'Boundary Box · Porur',date:tomorrow(),time:'18:00',total:12,joined:8,price:150,mine:false,host:false,status:'open'},{id:3,title:'Badminton, anyone?',sport:'Badminton',venue:'Court Culture · Anna Nagar',date:tomorrow(),time:'17:00',total:4,joined:3,price:200,mine:false,host:false,status:'open'},{id:4,title:'The evening five-a-side',sport:'Football',venue:'The Arena · Velachery',date:tomorrow(),time:'20:00',total:10,joined:7,price:120,mine:false,host:false,status:'open'}],payments:[],slots:[{id:1,venue:'The Arena · Velachery',date:tomorrow(),time:'21:00',price:1200,blocked:false},{id:2,venue:'Boundary Box · Porur',date:tomorrow(),time:'20:00',price:1800,blocked:false}],owners:[{id:1,name:'Court Culture',area:'Anna Nagar',status:'Pending'},{id:2,name:'The Arena',area:'Velachery',status:'Approved'}],activity:['Welcome to TRUF. Explore the demo and create your first match.']}}
let state;try{state=JSON.parse(localStorage.getItem(KEY))||seed()}catch{state=seed()};let role=location.hash==='#admin'?'admin':location.hash==='#owner'?'owner':'player',filter='All sports',query='';
function save(message){if(message)state.activity.unshift(message);try{localStorage.setItem(KEY,JSON.stringify(state))}catch{toast('Browser storage is unavailable; changes last for this session only.')}if(message)toast(message)}
function toast(t){document.getElementById('toast').textContent=t;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>document.getElementById('toast').textContent='',4200)}
function route(){return location.hash.slice(1)||'discover'}
function go(p){location.hash=p;if(route()===p)render()}
const icon={discover:'◈',matches:'▦',create:'＋',profile:'◎',owner:'▤',admin:'⊞',payments:'↗'};
function render(){let p=route();let nav=role==='player'?[['discover','Discover'],['matches','My matches'],['create','Create match'],['payments','My payments'],['profile','My profile']]:role==='owner'?[['owner','Owner dashboard'],['payments','Payment records'],['discover','Explore matches']]:[['admin','Admin overview'],['payments','Payment oversight'],['discover','Explore matches']];document.getElementById('app').innerHTML=`<div class="shell"><aside class="sidebar"><a class="brand" href="#discover"><span class="brand-mark">T</span>TRUF<span style="color:var(--accent)">.</span></a><div class="nav-label">Your playground</div><nav class="nav" aria-label="Main navigation">${nav.map(([id,n])=>`<a href="#${id}" class="${p===id?'active':''}" ${p===id?'aria-current="page"':''}><span aria-hidden="true">${icon[id]||'◇'}</span>${n}</a>`).join('')}</nav><div class="sidebar-bottom"><div class="row"><span class="avatar">PK</span><div><strong>${esc(state.profile.name)}</strong><div class="muted">${esc(state.profile.area)}</div></div></div><p class="note">TRUF Innovators<br>Made for the love of the game.</p></div></aside><div><header class="topbar"><span class="muted">⌖ ${esc(state.profile.area)} <span style="margin:0 8px;color:#444">/</span> Your local sports community</span><div class="topbar-right"><span class="demo">INTERACTIVE DEMO</span><label class="sr" for="role" style="position:absolute;left:-9999px">Demo role</label><select id="role" style="width:auto" onchange="changeRole(this.value)"><option value="player" ${role==='player'?'selected':''}>Player view</option><option value="owner" ${role==='owner'?'selected':''}>Owner view</option><option value="admin" ${role==='admin'?'selected':''}>Admin view</option></select><span class="avatar">PK</span></div></header><main class="content">${p==='create'?createPage():p==='profile'?profilePage():p==='owner'?ownerPage():p==='admin'?adminPage():p==='payments'?paymentsPage():p==='matches'?matchesPage():discoverPage()}</main></div></div>`;}
function changeRole(r){role=r;go(r==='owner'?'owner':r==='admin'?'admin':'discover')}
function title(h,p,action=''){return `<div class="heading"><div><h1>${h}</h1><p class="muted">${p}</p></div>${action}</div>`}
function stats(items){return `<div class="stats">${items.map(([n,v])=>`<div class="stat"><span>${n}</span><strong>${v}</strong></div>`).join('')}</div>`}
function dateLabel(d){return new Date(d+'T12:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short'})}
function status(m){return m.status==='cancelled'?'Cancelled':m.joined>=m.total?'Confirmed':'Finding players'}
function badge(m){return `<span class="badge ${m.status==='cancelled'?'neutral':m.joined<m.total?'pending':''}">${status(m)}</span>`}
function card(m){return `<article class="card"><div class="card-top"><span class="sport">${esc(m.sport)} ${m.sport==='Football'?'· '+m.total/2+'v'+m.total/2:''}</span>${badge(m)}</div><div class="card-body"><h3>${esc(m.title)}</h3><p class="meta">⌖ ${esc(m.venue)}</p><p class="meta">▦ ${dateLabel(m.date)} <span style="margin:0 5px">·</span> ${esc(m.time)} – ${Number(m.time.slice(0,2))+1}:00</p><div class="progress"><i style="width:${Math.min(100,m.joined/m.total*100)}%"></i></div><div class="row roster"><span><strong style="color:var(--text)">${m.joined}/${m.total}</strong> players committed</span><span>${m.status==='cancelled'?'Closed':m.mine?'You’re in':m.total-m.joined+' spots left'}</span></div><div class="row card-footer"><span class="price">${money(m.price)} <small>/ player</small></span><button class="small ${m.mine?'':'primary'}" onclick="details(${m.id})">${m.mine?'View match':'Match details'} ↗</button></div></div></article>`}
function filtered(){return state.matches.filter(m=>(filter==='All sports'||m.sport===filter)&&(m.title+' '+m.venue).toLowerCase().includes(query.toLowerCase())&&m.status!=='cancelled')}
function discoverPage(){let spots=state.matches.filter(m=>m.status==='open').reduce((n,m)=>n+m.total-m.joined,0);return title(`Your next game starts here.`,`Find your people. Pick a match. Show up and play.`,`<button class="primary" onclick="go('create')">＋ Create match</button>`)+`<section class="hero"><div><div class="eyebrow">Less planning. More playing.</div><h2>One player short?<br>You could be the difference.</h2><p>Join a local game with a spot waiting for you. Every commitment brings the team closer.</p><button class="primary" onclick="findAlmostFull()">Find a game to complete ↗</button></div><div class="hero-metric"><span>ROOM FOR YOU</span><strong>${spots}<span style="font-size:22px;letter-spacing:0"> open spots</span></strong><span>Across your demo sports community</span><div class="progress" style="max-width:250px;margin-top:20px"><i style="width:72%"></i></div></div></section>`+stats([['Open matches',state.matches.filter(m=>m.status==='open'&&m.joined<m.total).length],['Your upcoming games',state.matches.filter(m=>m.mine&&m.status!=='cancelled').length],['Your commitments',money(state.payments.filter(p=>p.status==='Paid').reduce((n,p)=>n+p.amount,0))]])+`<div class="section-head"><h2>Find your next match</h2><span class="muted" style="font-size:14px">All skill levels welcome</span></div><div class="filters">${['All sports','Football','Cricket','Badminton'].map(s=>`<button class="chip ${filter===s?'active':''}" onclick="setFilter('${s}')">${s}</button>`).join('')}<input class="search" aria-label="Search matches or venues" placeholder="Search match or venue…" value="${esc(query)}" oninput="searchMatches(this.value)"></div><div id="cards" class="grid">${filtered().map(card).join('')||'<div class="empty">No matches found. Try another sport or venue.</div>'}</div><p class="note">Sample community data · Payments are simulated · Changes are saved in this browser only</p>`}
function setFilter(s){filter=s;render()}function searchMatches(q){query=q;document.getElementById('cards').innerHTML=filtered().map(card).join('')||'<div class="empty">No matches found. Try another search.</div>'}
function findAlmostFull(){let m=state.matches.filter(m=>m.status==='open'&&!m.mine&&m.joined<m.total).sort((a,b)=>(a.total-a.joined)-(b.total-b.joined))[0];m?details(m.id):toast('No open matches right now. Create a new game.')}
function matchesPage(){let list=state.matches.filter(m=>m.mine||m.host);return title('Your games, all together.','Keep track of your commitments and the matches you organize.',`<button class="primary" onclick="go('create')">＋ Create match</button>`)+`<div class="grid">${list.map(card).join('')}</div>${!list.length?'<div class="empty"><h2>Your first game is waiting.</h2><p>Join a match or bring your own team together.</p><button onclick="go(\'discover\')">Explore matches</button></div>':''}`}
function openModal(html){const d=document.getElementById('modal');d.innerHTML=`<button class="close small" aria-label="Close dialog" onclick="closeModal()">✕</button>`+html;d.showModal()}
function closeModal(){document.getElementById('modal').close()}
function details(id){let m=state.matches.find(x=>x.id===id);openModal(`<div class="eyebrow">${esc(m.sport)} · MATCH DETAILS</div><h2>${esc(m.title)}</h2><p class="muted">${esc(m.venue)}<br>${dateLabel(m.date)} at ${esc(m.time)}</p>${badge(m)}<div class="progress"><i style="width:${m.joined/m.total*100}%"></i></div><p>${m.joined} of ${m.total} players committed · ${money(m.price)} per player</p><div class="notice">Demo commitment policy: the match confirms when every place is filled. A demo withdrawal returns your full share. No real money is collected.</div><p class="muted" style="font-size:14px">${m.joined} committed players${m.mine?' including you':''}. Personal contact details are not shared.</p><div class="actions">${m.status==='cancelled'?'<button onclick="closeModal()">Close</button>':m.mine?`<button class="danger" onclick="confirmWithdraw(${id})">Withdraw & refund</button>`:m.joined<m.total?`<button class="primary" onclick="checkout(${id})">Join · ${money(m.price)}</button>`:'<button disabled>Match full</button>'}${m.host&&m.status!=='cancelled'?`<button class="danger" onclick="confirmCancel(${id})">Cancel match</button>`:''}</div>`)}
function checkout(id){let m=state.matches.find(x=>x.id===id);openModal(`<div class="eyebrow">DEMO CHECKOUT</div><h2>Make your commitment.</h2><p class="muted">${esc(m.title)}</p><div class="panel"><div class="row"><span>Your place</span><strong>${money(m.price)}</strong></div><div class="row" style="margin-top:12px"><span>Demo service fee</span><span>₹0</span></div></div><div class="notice">This is a local payment simulation, not Razorpay checkout. Do not enter card or bank details. No money will be charged.</div><label><input type="checkbox" id="terms" style="width:18px;min-height:18px;vertical-align:middle"> I understand this is a demo and accept the demo cancellation policy.</label><div class="actions"><button onclick="paymentFailure()">Simulate failure</button><button class="primary" onclick="pay(${id})">Simulate payment</button></div><p id="payError" role="alert" style="color:#ffb5b5;margin-top:14px"></p>`)}
function paymentFailure(){document.getElementById('payError').textContent='Demo payment failed. Your place was not charged. You can retry.'}
function pay(id){if(!document.getElementById('terms').checked){document.getElementById('payError').textContent='Accept the demo policy to continue.';return}let m=state.matches.find(x=>x.id===id);if(m.mine||m.joined>=m.total||m.status==='cancelled'){toast('This place is no longer available.');closeModal();return}m.mine=true;m.joined++;state.payments.unshift({id:Date.now(),match:id,title:m.title,amount:m.price,status:'Paid',date:new Date().toLocaleDateString('en-IN')});save(m.joined===m.total?'Team complete! Your demo booking is confirmed.':'You’re in! Your demo commitment is recorded.');closeModal();render()}
function confirmWithdraw(id){openModal(`<h2>Leave this match?</h2><p>Your place will reopen for another player and your demo payment will be marked refunded.</p><div class="actions"><button onclick="closeModal()">Keep my place</button><button class="danger" onclick="withdraw(${id})">Withdraw & refund</button></div>`)}
function withdraw(id){let m=state.matches.find(x=>x.id===id);if(m.mine){m.mine=false;m.joined--;state.payments.filter(p=>p.match===id&&p.status==='Paid').forEach(p=>p.status='Refunded');save('Place released. Demo refund completed.')}closeModal();render()}
function createPage(){return title('Bring a game together.','Choose your sport, reserve a demo slot, and invite players.')+`<div class="two"><form class="panel" onsubmit="createMatch(event)"><h2>Match details</h2><div class="field"><label for="matchTitle">Match name</label><input id="matchTitle" name="title" required maxlength="70" placeholder="e.g. Friday night football"></div><div class="form-grid"><div class="field"><label for="sport">Sport</label><select id="sport" name="sport"><option>Football</option><option>Cricket</option><option>Badminton</option></select></div><div class="field"><label for="total">Players needed</label><input id="total" name="total" type="number" min="2" max="30" value="12" required></div></div><div class="field"><label for="slot">Available venue & slot</label><select name="slot" id="slot" required><option value="">Choose an available slot</option>${state.slots.filter(s=>!s.blocked&&!state.matches.some(m=>m.slot===s.id&&m.status!=='cancelled')).map(s=>`<option value="${s.id}">${esc(s.venue)} · ${dateLabel(s.date)} ${s.time} · ${money(s.price)}</option>`).join('')}</select></div><div class="notice">The total slot price is divided equally. Your own place is not committed until you join and complete demo checkout.</div><p id="createError" role="alert" class="danger"></p><button class="primary" type="submit">Create match ↗</button></form><aside class="panel"><div class="eyebrow">MATCH COMMITMENT</div><h2>A clear path to kick-off.</h2><p>1. Choose an available slot.</p><p>2. Players join and commit their share.</p><p>3. A full paid roster confirms the game.</p><p class="note">Need another slot? Switch to Owner view and add one. Slot reservation and role permissions here are demonstrations, not a production booking guarantee.</p></aside></div>`}
function createMatch(e){e.preventDefault();let f=new FormData(e.target),slot=state.slots.find(s=>s.id===Number(f.get('slot'))),total=Number(f.get('total'));if(!slot||slot.blocked||state.matches.some(m=>m.slot===slot.id&&m.status!=='cancelled')){document.getElementById('createError').textContent='This slot is unavailable.';return}if(slot.price*100%total!==0){document.getElementById('createError').textContent='Choose a player count that divides the slot price equally to the paise.';return}state.matches.unshift({id:Date.now(),title:f.get('title').trim(),sport:f.get('sport'),venue:slot.venue,date:slot.date,time:slot.time,total,joined:0,price:slot.price/total,mine:false,host:true,status:'open',slot:slot.id});save('Match created. Join it to commit your own place.');go('matches')}
function paymentsPage(){return title(role==='player'?'Your payment history.':'Payment oversight.','Demo transactions only. No real money has moved.')+stats([['Demo collected',money(state.payments.filter(p=>p.status==='Paid').reduce((n,p)=>n+p.amount,0))],['Demo refunded',money(state.payments.filter(p=>p.status==='Refunded').reduce((n,p)=>n+p.amount,0))],['Transactions',state.payments.length]])+`<div class="panel table-wrap"><table><thead><tr><th>Reference</th><th>Match</th><th>Date</th><th>Amount</th><th>Status</th></tr></thead><tbody>${state.payments.map(p=>`<tr><td>DEMO-${String(p.id).slice(-6)}</td><td>${esc(p.title)}</td><td>${esc(p.date)}</td><td>${money(p.amount)}</td><td><span class="badge ${p.status==='Refunded'?'neutral':''}">${p.status}</span></td></tr>`).join('')}</tbody></table>${!state.payments.length?'<div class="empty">No transactions yet. Join a match to try demo checkout.</div>':''}</div><p class="note">Owner and admin views intentionally share the same sample data in this prototype. Production access control is not implemented.</p>`}
function ownerPage(){return title('Your turf. Your control.','Manage demo slots and see the games taking shape.',`<button class="primary" onclick="addSlotDialog()">＋ Add slot</button>`)+stats([['Listed slots',state.slots.length],['Confirmed games',state.matches.filter(m=>m.joined===m.total&&m.status!=='cancelled').length],['Demo collected',money(state.payments.filter(p=>p.status==='Paid').reduce((n,p)=>n+p.amount,0))]])+`<section class="panel"><h2>Availability calendar</h2><div class="table-wrap"><table><thead><tr><th>Venue</th><th>Date & time</th><th>Price</th><th>Status</th><th>Action</th></tr></thead><tbody>${state.slots.map(s=>{let reserved=state.matches.some(m=>m.slot===s.id&&m.status!=='cancelled');return `<tr><td>${esc(s.venue)}</td><td>${dateLabel(s.date)} · ${s.time}</td><td>${money(s.price)}</td><td><span class="badge ${reserved?'pending':s.blocked?'neutral':''}">${reserved?'Held by match':s.blocked?'Blocked':'Available'}</span></td><td><button class="small" ${reserved?'disabled':''} onclick="toggleSlot(${s.id})">${s.blocked?'Reopen':'Block'}</button></td></tr>`}).join('')}</tbody></table></div></section><section class="panel"><h2>Match bookings</h2>${bookingTable()}</section>`}
function bookingTable(){return `<div class="table-wrap"><table><thead><tr><th>Match</th><th>Venue</th><th>Players</th><th>Status</th><th>Action</th></tr></thead><tbody>${state.matches.map(m=>`<tr><td>${esc(m.title)}</td><td>${esc(m.venue)}</td><td>${m.joined}/${m.total}</td><td>${badge(m)}</td><td><button class="small danger" ${m.status==='cancelled'?'disabled':''} onclick="confirmCancel(${m.id})">Cancel</button></td></tr>`).join('')}</tbody></table></div>`}
function toggleSlot(id){let s=state.slots.find(s=>s.id===id);s.blocked=!s.blocked;save(s.blocked?'Slot blocked.':'Slot reopened.');render()}
function addSlotDialog(){openModal(`<h2>Add an available slot</h2><form onsubmit="addSlot(event)"><div class="field"><label for="venue">Venue name and locality</label><input id="venue" name="venue" maxlength="80" required></div><div class="form-grid"><div class="field"><label for="date">Date</label><input id="date" type="date" name="date" min="${tomorrow()}" value="${tomorrow()}" required></div><div class="field"><label for="time">Start time (one-hour slot)</label><input id="time" type="time" name="time" max="22:59" required></div></div><div class="field"><label for="price">Total price (₹)</label><input id="price" type="number" name="price" min="100" max="50000" step="1" required></div><p id="slotError" role="alert" class="danger"></p><button class="primary">Save slot</button></form>`)}
function addSlot(e){e.preventDefault();let f=new FormData(e.target),s={id:Date.now(),venue:f.get('venue').trim(),date:f.get('date'),time:f.get('time'),price:Number(f.get('price')),blocked:false};let minute=t=>Number(t.slice(0,2))*60+Number(t.slice(3));if(state.slots.some(x=>x.venue.toLowerCase()===s.venue.toLowerCase()&&x.date===s.date&&Math.abs(minute(x.time)-minute(s.time))<60)||state.matches.some(x=>x.status!=='cancelled'&&x.venue.toLowerCase()===s.venue.toLowerCase()&&x.date===s.date&&Math.abs(minute(x.time)-minute(s.time))<60)){document.getElementById('slotError').textContent='This venue already has an overlapping slot or match.';return}state.slots.push(s);save('New slot added to availability.');closeModal();render()}
function confirmCancel(id){openModal(`<h2>Cancel this match?</h2><p>Players will lose their demo reservation. Recorded demo payments will be refunded and the slot released.</p><div class="actions"><button onclick="closeModal()">Keep match</button><button class="danger" onclick="cancelMatch(${id})">Cancel & refund</button></div>`)}
function cancelMatch(id){let m=state.matches.find(m=>m.id===id);m.status='cancelled';state.payments.filter(p=>p.match===id&&p.status==='Paid').forEach(p=>p.status='Refunded');save('Match cancelled and recorded demo payments refunded.');closeModal();render()}
function adminPage(){return title('The community, at a glance.','Approve venues, review bookings, and follow platform activity.')+stats([['Matches',state.matches.length],['Owner applications',state.owners.filter(o=>o.status==='Pending').length],['Demo transactions',state.payments.length]])+`<div class="notice">Admin preview: the role switcher demonstrates navigation only. This prototype has no authentication, secure permissions, or shared server database.</div><section class="panel"><h2>Owner applications</h2><div class="table-wrap"><table><thead><tr><th>Business</th><th>Locality</th><th>Status</th><th>Review</th></tr></thead><tbody>${state.owners.map(o=>`<tr><td>${esc(o.name)}</td><td>${esc(o.area)}</td><td><span class="badge ${o.status==='Pending'?'pending':'neutral'}">${o.status}</span></td><td>${o.status==='Pending'?`<button class="small primary" onclick="reviewOwner(${o.id},'Approved')">Approve</button> <button class="small" onclick="reviewOwner(${o.id},'Rejected')">Reject</button>`:'Reviewed'}</td></tr>`).join('')}</tbody></table></div></section><section class="panel"><h2>Booking oversight</h2>${bookingTable()}</section><section class="panel"><h2>Activity log</h2>${state.activity.slice(0,12).map(a=>`<div class="activity">${esc(a)}</div>`).join('')}</section>`}
function reviewOwner(id,status){state.owners.find(o=>o.id===id).status=status;save('Owner application '+status.toLowerCase()+'.');render()}
function profilePage(){return title('Make it your game.','Your preferences stay in this browser.')+`<div class="two"><form class="panel" onsubmit="updateProfile(event)"><h2>Player profile</h2><div class="field"><label for="name">Display name</label><input id="name" name="name" required maxlength="40" value="${esc(state.profile.name)}"></div><div class="field"><label for="area">City or locality</label><input id="area" name="area" required maxlength="60" value="${esc(state.profile.area)}"></div><div class="field"><label for="favorite">Favorite sport</label><select id="favorite" name="sport">${['Football','Cricket','Badminton'].map(s=>`<option ${s===state.profile.sport?'selected':''}>${s}</option>`).join('')}</select></div><button class="primary">Save preferences</button></form><aside class="panel"><h2>About this prototype</h2><p class="muted">Try every role from the menu at the top. Match commitments, refunds, owner approval, and slot changes persist locally.</p><p class="muted">Payments are simulations. Seed players are fictional. No real bookings, messages, or charges are made.</p><button class="danger" onclick="resetDialog()">Reset demo data</button></aside></div>`}
function updateProfile(e){e.preventDefault();let f=new FormData(e.target);state.profile={name:f.get('name').trim(),area:f.get('area').trim(),sport:f.get('sport')};save('Profile preferences saved.');render()}
function resetDialog(){openModal(`<h2>Reset this demo?</h2><p>This removes your local demo matches, payments, and preferences and restores the sample data.</p><div class="actions"><button onclick="closeModal()">Keep data</button><button class="danger" onclick="resetDemo()">Reset demo</button></div>`)}
function resetDemo(){state=seed();save('Demo reset.');closeModal();filter='All sports';query='';go('discover')}
window.addEventListener('hashchange',render);render();
</script></body></html>
