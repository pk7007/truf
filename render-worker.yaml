# Worker-only deployment for the Vercel web app and its existing PostgreSQL.
# Review the Render plan before applying; this file does not purchase a service.
services:
  - type: worker
    name: truf-worker
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run db:generate
    startCommand: npm run worker
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: TRUF_LOCAL_MODE
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_URL
        value: https://truf-red.vercel.app
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
