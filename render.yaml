# TRUF web and PostgreSQL are hosted on Vercel. This blueprint creates only
# the continuously running job worker. Applying it selects a paid Render plan.
services:
  - type: worker
    name: truf-worker
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run db:generate
    startCommand: npm run worker
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: DATABASE_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
