databases:
  - name: truf-db
    databaseName: truf
    user: truf
    plan: basic-256mb
services:
  - type: web
    name: truf-web
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: DATABASE_URL
        fromDatabase: { name: truf-db, property: connectionString }
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
  - type: worker
    name: truf-worker
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run db:generate
    startCommand: npm run worker
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: DATABASE_URL
        fromDatabase: { name: truf-db, property: connectionString }
      - key: BETTER_AUTH_SECRET
        fromService:
          { name: truf-web, type: web, envVarKey: BETTER_AUTH_SECRET }
      - key: BETTER_AUTH_URL
        fromService: { name: truf-web, type: web, envVarKey: BETTER_AUTH_URL }
      - key: RAZORPAY_KEY_ID
        fromService: { name: truf-web, type: web, envVarKey: RAZORPAY_KEY_ID }
      - key: RAZORPAY_KEY_SECRET
        fromService:
          { name: truf-web, type: web, envVarKey: RAZORPAY_KEY_SECRET }
